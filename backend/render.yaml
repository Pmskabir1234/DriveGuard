services:
  - type: web
    name: driveguard-backend
    env: python

    buildCommand: |
      apt-get update && apt-get install -y \
      libgl1-mesa-glx \
      libgles2 \
      libglib2.0-0 \
      libsm6 \
      libxext6 \
      libxrender1 \
      ffmpeg
      pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT